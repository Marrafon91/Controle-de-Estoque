# ========================================
# PostgreSQL - Railway
# ========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ========================================
# JPA / Hibernate
# ========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ========================================
# Flyway
# ========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ========================================
# JWT
# ========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ========================================
# Logging (evita logs verbosos em produção)
# ========================================

logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.https.github.com.fernandesdennys.dispensa=INFO


# ========================================
# Server
# ========================================

# A porta é injetada pelo Railway via ${PORT} no ENTRYPOINT do Dockerfile,
# não precisa (e não deve) ser fixada aqui.